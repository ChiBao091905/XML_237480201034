<!DOCTYPE html>
<html>
<body>

<p id="demo"></p>

<script>
var xhttp = new XMLHttpRequest();

xhttp.onreadystatechange = function() {
    if (this.readyState == 4 && this.status == 200) {
        myFunction(this);
    }
};

xhttp.open("GET", "bai5-buoi1.xml", true);
xhttp.send();

function myFunction(xml) {
    var xmlDoc = xml.responseXML;
    var x = xmlDoc.getElementsByTagName("dish")[0];
    var id = x.getAttributeNode("id");
    var name = x.getElementsByTagName("name")[0];
    var category = x.getElementsByTagName("category")[0];
    var price = x.getElementsByTagName("price")[0];
    var txt = "ID: " + id.nodeValue + "<br>";
    txt += "Tên món: " + name.textContent + "<br>";
    txt += "Loại: " + category.textContent + "<br>";
    txt += "Giá: " + price.textContent + " VND";
    document.getElementById("demo").innerHTML = txt;
}
</script>
</body>
</html>
