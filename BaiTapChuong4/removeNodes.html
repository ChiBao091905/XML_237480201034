<!DOCTYPE html>
<html>
<body>
<p id="demo"></p>
<script>
var xhttp = new XMLHttpRequest();

xhttp.onreadystatechange = function() {
    if (this.readyState == 4 && this.status == 200) {
        myFunction(this);
    }
};
xhttp.open("GET", "bai5-buoi1.xml", true);
xhttp.send();
function myFunction(xml) {
    var x, attnode, old_att, xmlDoc, txt;
    xmlDoc = xml.responseXML;
    txt = "";
    x = xmlDoc.getElementsByTagName("dish")[0];
    while (x.attributes.length > 0) {
        attnode = x.attributes[0];
        old_att = x.removeAttributeNode(attnode);
        txt += "Removed: " + old_att.nodeName +
               ": " + old_att.nodeValue + "<br>";
    }
    document.getElementById("demo").innerHTML = txt;
}
</script>
</body>
</html>
