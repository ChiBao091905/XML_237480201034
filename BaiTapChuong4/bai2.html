<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 2: Viết chương trình hiển danh sách các đơn vị trong tài liệu xml danhsachnhanvien.xml</title>
</head>
<body>
    <h2>Kết quả nhận được từ file XML</h2>
    <div id="output"></div>
    <script>
        var xhttp = new XMLHttpRequest();
        xhttp.onreadystatechange = function() {
            if (this.readyState == 4 && this.status == 200) {
                myFunction(this);
            }
        };
        xhttp.open("GET", "danhsachnhanvien.xml", true);
        xhttp.send();
        function myFunction(xml) {
            var xmlDoc = xml.responseXML;
            var dsDonvi = xmlDoc.getElementsByTagName("donvi");
            var txt = "";
            for (var i = 0; i < dsDonvi.length; i++) {
                txt += dsDonvi[i].childNodes[0].nodeValue + "<br>";
            }
            document.getElementById("output").innerHTML = "Danh sách đơn vị : " + "<br>" + txt;
        }
    </script>
</body>
</html>
