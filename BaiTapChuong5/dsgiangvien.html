<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Giảng Viên</title>
    <style>
        table {
            border-collapse: collapse;
            width: 80%;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #333;
            padding: 8px 12px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <h2>HỒ SƠ GIẢNG VIÊN</h2>
    <div id="ketqua">Đang tải dữ liệu...</div>

    <script>
        var xhr = new XMLHttpRequest();
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4 && xhr.status === 200) {
                var xmlDoc = xhr.responseXML;
                var list = xmlDoc.getElementsByTagName("giangvien");

                var table = "<table>";
                table += "<tr><th>STT</th><th>Họ tên giảng viên</th><th>Ngành</th><th>Đơn vị</th></tr>";

                for (var i = 0; i < list.length; i++) {
                    var hoten = list[i].getElementsByTagName("hoten")[0].textContent.trim();
                    var nganh = list[i].getElementsByTagName("nganh")[0].textContent.trim();
                    var donvi = list[i].getElementsByTagName("donvi")[0].textContent.trim();

                    table += "<tr>";
                    table += "<td>" + (i + 1) + "</td>";
                    table += "<td>" + hoten + "</td>";
                    table += "<td>" + nganh + "</td>";
                    table += "<td>" + donvi + "</td>";
                    table += "</tr>";
                }
                table += "</table>";

                document.getElementById("ketqua").innerHTML = table;
            }
        };

        xhr.open("GET", "hosogiangvien.xml", true);
        xhr.send();
    </script>
</body>
</html>
